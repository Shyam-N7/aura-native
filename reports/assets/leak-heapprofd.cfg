buffers {
  size_kb: 131072
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 16384
      process_cmdline: "live.aurafm.app"
      shmem_size_bytes: 8388608
      block_client: true
      continuous_dump_config {
        dump_phase_ms: 30000
        dump_interval_ms: 30000
      }
    }
  }
}

duration_ms: 240000
flush_period_ms: 30000

name: ci

# There was no CI at all before this: no workflows, no e2e, and no native
# tests (android/app/src/androidTest and .../test do not exist). 70 Jest suites,
# all JS. Everything else — including a 600-line GlassBlurController — was
# verified by one person launching one build on one phone.
#
# That is how a blur radius raised from 20 to 40 for a visual complaint on an
# API 34 device made the app unlaunchable on API 26-30 and stayed that way for
# eleven days. Nothing between the change and a human noticing.

on:
  # Only main on push. A branch with an open PR is already covered by the
  # pull_request event, and listening to both ran the whole job twice per
  # commit — the concurrency group could not dedupe them either, because
  # github.ref differs between the two events (refs/heads/x vs refs/pull/n/merge).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run pointless. Keyed on
# head_ref so the group is the same across re-pushes to one branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # package.json engines: >=20
          cache: npm

      # `npm install`, not `npm ci`. ci demands a lockfile in exact sync with
      # package.json, and this one has been drifted since the initial import —
      # typescript@6.0.3 missing, picomatch 2.3.2 vs 4.0.5. That is a real
      # inconsistency and worth fixing, but regenerating the lockfile churns
      # dependency versions and does not belong in the same change as a crash
      # fix. Tracked separately; this job's purpose is lint + tests.
      #
      # No --ignore-scripts either way: postinstall runs patch-package, and
      # react-native-track-player is patched.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npx jest --ci

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // 26+ so the launcher icon can be adaptive-only (no legacy PNGs). Sideload app;
        // the one target device runs Android 14.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // FCM (react-native-firebase 24.x): reads android/app/google-services.json
        // at build time and wires the Firebase client ids into resources.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-track-player resolves KotlinAudio as a prebuilt JitPack AAR;
// swap in the vendored source module so its notification artwork-bitmap leak
// fix actually ships (see kotlin-audio/build.gradle).
subprojects {
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.github.doublesymmetry:kotlinaudio') using project(':kotlin-audio')
        }
    }
}

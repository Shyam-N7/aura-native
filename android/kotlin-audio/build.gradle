// KotlinAudio v2.1.0 (github.com/doublesymmetry/KotlinAudio, Apache-2.0),
// vendored as a source module: react-native-track-player pulls this library
// as a prebuilt JitPack AAR, which left no patchable seam for the notification
// artwork-bitmap leak fixed in NotificationManager.kt (see the comment there).
// Vendoring also removes the JitPack network dependency from clean builds.
// Dependencies match the upstream v2.1.0 build.gradle; publishing and test
// wiring are dropped, sdk levels come from the root project.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.doublesymmetry.kotlinaudio"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'io.coil-kt:coil:2.2.0'
    implementation 'androidx.media:media:1.6.0'
    api 'com.google.android.exoplayer:exoplayer:2.19.0'
    api 'com.google.android.exoplayer:extension-mediasession:2.19.0'
    api 'com.jakewharton.timber:timber:5.0.1'
}
